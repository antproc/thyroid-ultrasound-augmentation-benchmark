[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thyroid-augmentation"
version = "0.1.0"
description = "Reproducible augmentation experiments for thyroid nodule ultrasound segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "albumentations==1.4.18",
  "hydra-core==1.3.2",
  "lightning==2.2.4",
  "monai==1.3.0",
  "torchmetrics==1.4.0.post0",
]

[project.optional-dependencies]
models = [
  "segmentation-models-pytorch==0.5.0",
  "timm==1.0.24",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
